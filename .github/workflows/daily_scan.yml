# daily_scan.yml — runs the full daily pipeline on a schedule (no PC needed)
# and publishes the mobile-friendly report to GitHub Pages.
#
# WHAT THIS DOES EACH MORNING:
#   1. Restores the accumulated data/ cache from the previous run (batted-ball
#      parquet history, predictions log, park/weather stability logs for both
#      HR and hits) — same incremental idea as daily_update.py, just running
#      on GitHub's servers instead of your PC.
#   2. Runs daily_update.py (resolves yesterday's HR predictions, pulls new
#      data, recalibrates both the HR and hits pipelines), then
#      hr_scanner_auto.py — which now scores AND renders BOTH the HR and
#      hits boards onto the same docs/index.html page (a nav pill at the top
#      jumps between them). hits_scanner_auto.py still exists as a
#      standalone way to run just the hits side by hand, but isn't run here
#      since hr_scanner_auto.py already covers everything the page needs.
#   3. Saves the updated data/ cache back for tomorrow.
#   4. Publishes docs/index.html to GitHub Pages — that's the URL you check
#      from your phone.
#
# SAFETY PROPERTY WORTH KNOWING: if any step fails (bad data pull, an off
# day, a network hiccup), the deploy step is simply skipped and the site
# keeps showing the last successful day's board — it never goes blank or
# shows a broken page.
#
# ONE-TIME SETUP (in the GitHub repo's Settings, after pushing this file):
#   Settings -> Pages -> Source -> "GitHub Actions"  (not "Deploy from a branch")
#   That's it — no secrets needed, pybaseball/statsapi are public APIs.
#
# TIMING: cron is in UTC. Currently set for 16:00 UTC = 12:00 PM Eastern
# during EDT (summer, UTC-4). DST isn't handled automatically by cron — when
# clocks fall back in early November, EST is UTC-5, so bump this to 17:00 UTC
# to keep hitting noon ET. Nudge back to 16:00 UTC when clocks spring forward
# again in March.

name: Daily HR Scan

on:
  schedule:
    - cron: "0 16 * * *"    # 16:00 UTC = noon ET (EDT) — see timing note above
  workflow_dispatch: {}      # lets you trigger a manual run from the GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Restore accumulated data cache
        uses: actions/cache@v4
        with:
          path: data
          key: hr-model-data-${{ github.run_id }}
          restore-keys: |
            hr-model-data-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pybaseball MLB-StatsAPI pandas statsmodels pyarrow

      - name: Pull new data and recalibrate (HR + hits)
        run: python3 daily_update.py

      - name: Score today's slate and generate the report
        run: python3 hr_scanner_auto.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload report as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
