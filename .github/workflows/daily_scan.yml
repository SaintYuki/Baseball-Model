# daily_scan.yml — runs the full daily pipeline on a schedule (no PC needed)
# and publishes the mobile-friendly report to GitHub Pages.
#
# WHAT THIS DOES EACH MORNING:
#   1. Restores the accumulated data/ cache from the previous run (batted-ball
#      parquet history, predictions log, park/weather stability logs for both
#      HR and hits) — same incremental idea as daily_update.py, just running
#      on GitHub's servers instead of your PC.
#   2. Runs daily_update.py (which internally resolves yesterday's HR
#      predictions, pulls new data, and recalibrates both the HR and hits
#      pipelines), then hr_scanner_auto.py — the exact same commands you'd
#      run by hand. hits_scanner_auto.py isn't run here yet since its output
#      doesn't feed the HTML report — the hits stability log still advances
#      daily via daily_update.py regardless.
#   3. Saves the updated data/ cache back for tomorrow.
#   4. Publishes docs/index.html (generated by hr_scanner_auto.py) to GitHub
#      Pages — that's the URL you check from your phone.
#
# SAFETY PROPERTY WORTH KNOWING: if any step fails (bad data pull, an off
# day, a network hiccup), the deploy step is simply skipped and the site
# keeps showing the last successful day's board — it never goes blank or
# shows a broken page.
#
# ONE-TIME SETUP (in the GitHub repo's Settings, after pushing this file):
#   Settings -> Pages -> Source -> "GitHub Actions"  (not "Deploy from a branch")
#   That's it — no secrets needed, pybaseball/statsapi are public APIs.
#
# TIMING: cron is in UTC. 12:00 UTC = 8:00 AM Eastern during EDT (summer),
# 7:00 AM Eastern during EST (winter) — DST isn't handled automatically by
# cron, so nudge the hour by 1 if you notice it drifting an hour after a
# clock change. Adjust below if you want it running closer to first pitch.

name: Daily HR Scan

on:
  schedule:
    - cron: "0 12 * * *"    # 12:00 UTC every day — see timing note above
  workflow_dispatch: {}      # lets you trigger a manual run from the GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Restore accumulated data cache
        uses: actions/cache@v4
        with:
          path: data
          key: hr-model-data-${{ github.run_id }}
          restore-keys: |
            hr-model-data-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pybaseball MLB-StatsAPI pandas statsmodels pyarrow

      - name: Pull new data and recalibrate (HR + hits)
        run: python3 daily_update.py

      - name: Score today's slate and generate the report
        run: python3 hr_scanner_auto.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload report as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
